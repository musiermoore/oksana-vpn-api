openapi: 3.1.0
info:
  title: Oksana VPN API
  version: 1.0.0
  description: Versioned Go API contract for the Mini App VLESS link operation.
servers:
  - url: /api/v1
paths:
  /vless/link:
    get:
      operationId: getVlessClientDeepLinks
      summary: Get VLESS client deep links
      description: Returns the Happ, Incy, and V2RayTun deep links for the authenticated user. Raw link visibility is always disabled in this response.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Client deep links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - happ_deep_link
                  - incy_deep_link
                  - v2raytun_deep_link
                  - show_raw_link
                properties:
                  happ_deep_link:
                    type: string
                    format: uri
                  incy_deep_link:
                    type: string
                    format: uri
                  v2raytun_deep_link:
                    type: string
                    format: uri
                  show_raw_link:
                    type: boolean
                    const: false
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: User has no active subscription.
          content:
            application/json:
              schema:
                type: object
                required: [type, message]
                properties:
                  type:
                    type: string
                    const: debt
                  message:
                    type: string
        '500':
          description: The user record or UUID could not be loaded.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
